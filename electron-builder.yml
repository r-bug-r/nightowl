appId: org.sheif.nightowl
productName: Nightowl
copyright: Copyright (c) 2026 Sheif
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: native/bin
    to: native
win:
  icon: build/icon.ico
  artifactName: Nightowl.Setup.${version}.${ext}
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  shortcutName: Nightowl
publish:
  provider: github
  owner: r-bug-r
  repo: nightowl
