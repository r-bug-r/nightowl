name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Package self-contained Windows NSIS installer
        run: npm run package:win

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release\Nightowl.Setup.$version.exe"
          if (-not (Test-Path $installer)) {
            throw "Expected installer not found at $installer"
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Nightowl.Setup.$version.exe" | Set-Content -Encoding ascii "release\SHA256SUMS.txt"
          Get-Content "release\SHA256SUMS.txt"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Nightowl.Setup.*.exe
            release/Nightowl.Setup.*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
